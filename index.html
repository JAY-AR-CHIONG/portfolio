<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0f" />

    <meta
      name="description"
      content="Josh Rafael B. Chiong — Full-Stack Developer and BS Computer Science graduate from Zamboanga City, Philippines. Builder of web, mobile, and database-driven business systems with Laravel, React, Flutter, and MySQL."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Josh Rafael Chiong — Full-Stack Developer" />

      property="og:description"
      content="Portfolio of Josh Rafael B. Chiong: commissioned business systems, internship work, and academic projects built with Laravel, React, Flutter, and MySQL."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme = stored || "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
